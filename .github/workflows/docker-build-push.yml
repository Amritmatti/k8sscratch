# Build both application images and push them to Docker Hub tagged with the
# commit hash.
#
# There are TWO images, and they are versioned together:
#   employee-api       ./app       Node.js JSON API
#   employee-frontend  ./frontend  nginx serving the Employee Directory UI
#
# They share a tag on purpose. The chart deploys one release containing both,
# so a single commit hash identifies the whole thing — `--set image.tag=$SHA
# --set frontend.image.tag=$SHA` and you know exactly what is running.
#
# The commit hash is the whole point: it is immutable, so a running deployment
# can always be traced back to exactly one commit. `latest` is also pushed from
# the default branch as a convenience, but never deploy from it — you cannot
# tell what it points at, and a node restart can silently change the version.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME   your Docker Hub account name
#   DOCKERHUB_TOKEN      an access token from hub.docker.com/settings/security
#                        (an access token, NOT your password — it can be
#                        scoped and revoked independently)
#
# Optional repository variable:
#   DOCKERHUB_NAMESPACE  Docker Hub account or org the images live under.
#                        Defaults to DOCKERHUB_USERNAME. Set this when the
#                        images belong to an org you push to as a user.

name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
    paths:
      # Only rebuild when something that lands in an image changes.
      - 'app/**'
      - 'frontend/**'
      - '.github/workflows/docker-build-push.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push to Docker Hub (otherwise build only)'
        type: boolean
        default: true

concurrency:
  # Supersede an in-flight run for the same branch; keep tag builds.
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest

    strategy:
      # Push every image that builds. Failing the whole matrix on one failure
      # would leave the two images on different commits, which is worse than
      # one missing image you can see in the summary.
      fail-fast: false
      matrix:
        image:
          - name: employee-api
            context: ./app
            dockerfile: ./app/Dockerfile
          - name: employee-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Derive image tags
        id: meta
        run: |
          set -euo pipefail

          SHA_SHORT="$(git rev-parse --short=7 HEAD)"
          SHA_FULL="$(git rev-parse HEAD)"

          NAMESPACE="${{ vars.DOCKERHUB_NAMESPACE }}"
          if [ -z "$NAMESPACE" ]; then
            NAMESPACE="${{ secrets.DOCKERHUB_USERNAME }}"
          fi
          REPO="${NAMESPACE}/${{ matrix.image.name }}"

          # The commit hash tag — the deployable identifier.
          TAGS="${REPO}:${SHA_SHORT}"
          TAGS="${TAGS},${REPO}:${SHA_FULL}"

          # Convenience tags. Not for deployment.
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
            TAGS="${TAGS},${REPO}:latest"
          fi
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAGS="${TAGS},${REPO}:${GITHUB_REF#refs/tags/}"
          fi

          {
            echo "tags=${TAGS}"
            echo "repository=${REPO}"
            echo "sha_short=${SHA_SHORT}"
            echo "sha_full=${SHA_FULL}"
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

          echo "Image tags:"
          echo "${TAGS}" | tr ',' '\n' | sed 's/^/  /'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped for pull requests from forks, which have no access to secrets.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          # A pull request build verifies the Dockerfile without publishing.
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          # GitHub Actions layer cache. Scoped per image, or the two builds
          # would evict each other's layers on every run.
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.sha_full }}
            APP_VERSION=${{ steps.meta.outputs.sha_short }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          # Supply-chain attestations. These make the pushed artifact an image
          # index with an extra "unknown/unknown" entry — fine for kubelet,
          # which resolves by platform, but `ctr images import` can refuse it.
          # Side-loading onto nodes? Build locally with --provenance=false.
          provenance: true
          sbom: true

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.image.name }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Repository | \`${{ steps.meta.outputs.repository }}\` |"
            echo "| Commit tag | \`${{ steps.meta.outputs.sha_short }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Pushed | ${{ github.event_name != 'pull_request' }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-command:
    name: Deploy command
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    steps:
      - name: Print the helm command for this commit
        run: |
          set -euo pipefail

          NAMESPACE="${{ vars.DOCKERHUB_NAMESPACE }}"
          if [ -z "$NAMESPACE" ]; then
            NAMESPACE="${{ secrets.DOCKERHUB_USERNAME }}"
          fi
          SHA_SHORT="${GITHUB_SHA:0:7}"

          {
            echo "### Deploy this exact build"
            echo ""
            echo "Both images carry the same tag, so one commit hash pins the"
            echo "whole release."
            echo ""
            echo '```bash'
            echo "# The namespace must exist first — Helm writes its release Secret"
            echo "# into it — but the chart renders its own Namespace for the"
            echo "# istio-injection and PodSecurity labels. So pre-create it with"
            echo "# Helm's ownership metadata and let the chart adopt it."
            echo "# Do NOT pass --create-namespace: that fails ownership validation."
            echo "kubectl create namespace employee-app"
            echo "kubectl label namespace employee-app app.kubernetes.io/managed-by=Helm --overwrite"
            echo "kubectl annotate namespace employee-app \\"
            echo "  meta.helm.sh/release-name=employee-api \\"
            echo "  meta.helm.sh/release-namespace=employee-app --overwrite"
            echo ""
            echo "helm upgrade --install employee-api ./charts/employee-api \\"
            echo "  --namespace employee-app \\"
            echo "  --set image.repository=${NAMESPACE}/employee-api \\"
            echo "  --set image.tag=${SHA_SHORT} \\"
            echo "  --set frontend.image.repository=${NAMESPACE}/employee-frontend \\"
            echo "  --set frontend.image.tag=${SHA_SHORT} \\"
            echo "  --set secrets.dbPassword=\"\$DB_PASSWORD\" \\"
            echo "  --set secrets.postgresPassword=\"\$DB_PASSWORD\" \\"
            echo "  --wait --timeout 10m"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
