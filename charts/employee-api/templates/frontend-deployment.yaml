{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "employee-api.frontend.fullname" . }}
  namespace: {{ include "employee-api.namespace" . }}
  labels:
    {{- include "employee-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "employee-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "employee-api.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pods when the nginx config changes. Without this a
        # `helm upgrade` that only edits the ConfigMap leaves every pod serving
        # the old config until something else happens to restart it.
        checksum/nginx-config: {{ include (print $.Template.BasePath "/frontend-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "employee-api.frontend.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecretName }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      securityContext:
        # uid/gid 101 is the `nginx` user in the nginx-unprivileged image.
        runAsNonRoot: true
        runAsUser: {{ .Values.frontend.runAsUser }}
        runAsGroup: {{ .Values.frontend.runAsUser }}
        fsGroup: {{ .Values.frontend.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.frontend.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "employee-api.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: frontend
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nginx
          image: {{ include "employee-api.frontend.image" . }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: {{ .Values.frontend.runAsUser }}
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.frontend.containerPort }}
              protocol: TCP
          # Both probes hit nginx's own endpoint, never the API. A database
          # outage must not restart the UI pods.
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            # readOnlyRootFilesystem is true, so every path nginx writes to
            # needs to be a writable volume: its pid and the request-body and
            # proxy temp files live under /tmp, caches under /var/cache/nginx.
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "employee-api.frontend.fullname" . }}-nginx
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
