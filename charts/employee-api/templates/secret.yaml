{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "employee-api.secretName" . }}
  namespace: {{ include "employee-api.namespace" . }}
  labels:
    {{- include "employee-api.labels" . | nindent 4 }}
type: Opaque
# NOTE: Kubernetes Secrets are base64-encoded, not encrypted. Access is
# restricted by RBAC; see values.yaml for how to supply these from an external
# secret manager instead of this file.
stringData:
  DB_NAME: {{ required "secrets.dbName is required" .Values.secrets.dbName | quote }}
  DB_USER: {{ required "secrets.dbUser is required" .Values.secrets.dbUser | quote }}
  DB_PASSWORD: {{ required "secrets.dbPassword is required" .Values.secrets.dbPassword | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
  {{- end }}
{{- end }}
