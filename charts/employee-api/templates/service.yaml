apiVersion: v1
kind: Service
metadata:
  name: {{ include "employee-api.fullname" . }}
  namespace: {{ include "employee-api.namespace" . }}
  labels:
    {{- include "employee-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # Istio routes by port name: the `http-` prefix tells the sidecar to apply
    # HTTP-level policy and telemetry. An unnamed port falls back to plain TCP
    # and the VirtualService rules would not apply.
    - name: http-api
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: http-metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "employee-api.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
