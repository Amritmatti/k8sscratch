{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "employee-api.serviceAccountName" . }}
  namespace: {{ include "employee-api.namespace" . }}
  labels:
    {{- include "employee-api.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application never calls the Kubernetes API, so it is given no token.
# A container without cluster credentials has nothing for an attacker to use.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
