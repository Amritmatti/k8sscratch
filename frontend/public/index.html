<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Directory</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <h1>Employee Directory</h1>
      <span class="status" id="status" data-state="loading">checking&hellip;</span>
    </div>
  </header>

  <main>
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Add an employee</h2>
      <form id="employee-form" novalidate>
        <input type="hidden" id="employee-id" name="id">
        <div class="grid">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required maxlength="120" autocomplete="off" placeholder="Ada Lovelace">
          </div>
          <div class="field">
            <label for="designation">Designation</label>
            <input id="designation" name="designation" type="text" required maxlength="120" autocomplete="off" placeholder="Principal Engineer">
          </div>
          <div class="field">
            <label for="dob">Date of birth</label>
            <input id="dob" name="dob" type="date" required>
          </div>
          <div class="field">
            <label for="doj">Date of joining</label>
            <input id="doj" name="doj" type="date" required>
          </div>
        </div>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <div class="actions">
          <button type="submit" class="primary" id="submit-btn">Add employee</button>
          <button type="button" class="ghost" id="cancel-btn" hidden>Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title">Records <span class="count" id="count"></span></h2>
        <input id="search" type="search" placeholder="Filter by name or designation" aria-label="Filter records" autocomplete="off">
      </div>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th scope="col" class="col-id">ID</th>
              <th scope="col">Name</th>
              <th scope="col">Designation</th>
              <th scope="col">Date of birth</th>
              <th scope="col">Date of joining</th>
              <th scope="col"><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <p class="empty" id="empty" hidden>No records yet. Add the first one above.</p>
    </section>
  </main>

  <footer>
    <span id="meta">employee-api</span>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
